name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: backend
      - run: node --check app.js
        working-directory: backend
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
